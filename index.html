<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Anime Loft · open source anime streaming</title>
  <meta name="theme-color" content="#0b0c10">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

  <!-- TOASTS CONTAINER -->
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>

  <!-- HEADER / NAVBAR -->
  <header class="header">
    <div class="header-inner container">
      <a href="#/home" class="brand" aria-label="Anime Loft Home">
        <img src="assets/logo.jpg" alt="" class="brand-logo" onerror="this.style.display='none'">
        <span class="brand-name">Anime <span>Loft</span></span>
      </a>

      <nav class="nav-tabs hide-mobile" aria-label="Main Navigation">
        <a href="#/home" data-view="home" class="nav-tab"><i class="ph ph-house"></i><span data-i18n="home">Home</span></a>
        <a href="#/browse" data-view="browse" class="nav-tab"><i class="ph ph-compass"></i><span data-i18n="browse">Browse</span></a>
        <a href="#/list" data-view="list" class="nav-tab"><i class="ph ph-bookmark"></i><span data-i18n="myList">My List</span></a>
      </nav>

      <div class="header-actions">
        <div class="search-wrap">
          <i class="ph ph-magnifying-glass search-icon" aria-hidden="true"></i>
          <input type="search" id="search-input" class="search-input" data-i18n-ph="searchPh" placeholder="Search anime... ( / )" autocomplete="off" spellcheck="false">
          <kbd class="search-kbd hide-touch">/</kbd>
        </div>

        <button type="button" class="btn-icon" data-action="surprise" data-i18n-title="surprise" title="Surprise Me">
          <i class="ph ph-shuffle"></i>
        </button>

        <button type="button" class="btn-icon" data-action="settings" data-i18n-title="settings" title="Settings">
          <i class="ph ph-gear"></i>
        </button>

        <div id="auth-slot">
          <button type="button" class="btn btn-secondary btn-sm" data-action="login" id="login-btn"><span data-i18n="login">Login AniList</span></button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main id="app" class="main container">

    <!-- HOME VIEW -->
    <div data-view-panel="home" class="view-panel">
      <section id="hero" class="hero" aria-label="Featured Anime"></section>
      
      <!-- Continue Watching Row -->
      <section id="row-continue" class="row" aria-labelledby="h-continue" hidden>
        <div class="row-head">
          <h2 class="heading-5" id="h-continue" data-i18n="continueWatching">Continue Watching</h2>
        </div>
        <div class="rail rail-wide" id="rail-continue"></div>
      </section>

      <div id="home-rows"></div>
    </div>

    <!-- BROWSE / CATEGORIES VIEW -->
    <div data-view-panel="browse" class="view-panel" hidden>
      <div class="browse-filters">
        <div class="filter-group">
          <label for="f-year" data-i18n="year">Year</label>
          <select id="f-year" class="select"><option value="">Any</option></select>
        </div>
        <div class="filter-group">
          <label for="f-season" data-i18n="season">Season</label>
          <select id="f-season" class="select">
            <option value="">Any</option>
            <option value="WINTER">Winter</option>
            <option value="SPRING">Spring</option>
            <option value="SUMMER">Summer</option>
            <option value="FALL">Fall</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="f-format" data-i18n="format">Format</label>
          <select id="f-format" class="select">
            <option value="">Any</option>
            <option value="TV">TV</option>
            <option value="MOVIE">Movie</option>
            <option value="OVA">OVA</option>
            <option value="SPECIAL">Special</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="f-genre" data-i18n="genre">Genre</label>
          <select id="f-genre" class="select"><option value="">Any</option></select>
        </div>
        <div class="filter-group">
          <label for="f-sort" data-i18n="sort">Sort By</label>
          <select id="f-sort" class="select">
            <option value="POPULARITY_DESC">Most Popular</option>
            <option value="SCORE_DESC">Highest Rated</option>
            <option value="TRENDING_DESC">Trending</option>
            <option value="START_DATE_DESC">Newest</option>
          </select>
        </div>
      </div>

      <div class="genre-chips-wrap" id="genre-chips"></div>

      <div class="grid" id="browse-grid"></div>
      <div class="load-more-wrap">
        <button type="button" id="browse-more" class="btn btn-secondary" data-i18n="loadMore">Load More</button>
      </div>
    </div>

    <!-- MY LIST VIEW -->
    <div data-view-panel="list" class="view-panel" hidden>
      <div class="list-tabs">
        <button type="button" class="tab-btn active" data-list-tab="favorites" data-i18n="favorites">Favorites</button>
        <button type="button" class="tab-btn" data-list-tab="history" data-i18n="history">History</button>
        <button type="button" class="tab-btn" data-list-tab="anilist" data-i18n="anilistList" hidden>AniList List</button>
      </div>
      <div class="grid" id="list-grid"></div>
    </div>

    <!-- SEARCH VIEW -->
    <div data-view-panel="search" class="view-panel" hidden>
      <h2 class="heading-4 search-heading" id="search-h"></h2>
      <div class="grid" id="search-grid"></div>
    </div>

  </main>

  <!-- MOBILE BOTTOM NAV -->
  <nav class="mobile-nav show-mobile" aria-label="Mobile Navigation">
    <a href="#/home" data-view="home" class="m-tab"><i class="ph ph-house"></i><span data-i18n="home">Home</span></a>
    <a href="#/browse" data-view="browse" class="m-tab"><i class="ph ph-compass"></i><span data-i18n="browse">Browse</span></a>
    <a href="#/list" data-view="list" class="m-tab"><i class="ph ph-bookmark"></i><span data-i18n="myList">My List</span></a>
  </nav>

  <!-- MODALS CONTAINER -->
  <div id="modals">
    <!-- DETAIL MODAL -->
    <div class="layer" id="layer-detail" hidden aria-hidden="true" role="dialog" aria-modal="true">
      <div class="layer-backdrop" data-close></div>
      <div class="layer-box modal-box" id="detail-box"></div>
    </div>

    <!-- PLAYER MODAL -->
    <div class="layer player-layer" id="layer-player" hidden aria-hidden="true" role="dialog" aria-modal="true">
      <div class="player-topbar">
        <button type="button" class="btn-icon" data-close-player aria-label="Close player"><i class="ph ph-arrow-left"></i></button>
        <div class="player-title" id="player-title"></div>
        <div class="player-top-actions" id="player-top-actions"></div>
      </div>
      <div class="player-stage" id="player-stage">
        <iframe id="player-iframe" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="player-botbar" id="player-botbar"></div>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="layer" id="layer-settings" hidden aria-hidden="true" role="dialog" aria-modal="true">
      <div class="layer-backdrop" data-close></div>
      <div class="layer-box settings-box">
        <div class="modal-head">
          <h3 class="heading-4" data-i18n="settings">Settings</h3>
          <button type="button" class="btn-icon" data-close aria-label="Close"><i class="ph ph-x"></i></button>
        </div>
        <div class="modal-body settings-body">
          <div class="setting-item">
            <div>
              <span class="setting-label" data-i18n="language">Language</span>
              <span class="setting-sub" data-i18n="langSub">Interface language</span>
            </div>
            <select id="s-lang" class="select"></select>
          </div>
          <div class="setting-item">
            <div>
              <span class="setting-label" data-i18n="theme">Theme</span>
              <span class="setting-sub" data-i18n="themeSub">Dark or OLED black</span>
            </div>
            <select id="s-theme" class="select">
              <option value="dark">Dark</option>
              <option value="oled">OLED Pitch Black</option>
            </select>
          </div>
          <div class="setting-item">
            <div>
              <span class="setting-label" data-i18n="nsfw">NSFW Content</span>
              <span class="setting-sub" data-i18n="nsfwSub">Show 18+ items in catalog</span>
            </div>
            <label class="switch"><input type="checkbox" id="s-nsfw"><span class="slider"></span></label>
          </div>
          <div class="setting-item">
            <div>
              <span class="setting-label" data-i18n="privacy">Privacy Mode</span>
              <span class="setting-sub" data-i18n="privacySub">Hide continue watching row</span>
            </div>
            <label class="switch"><input type="checkbox" id="s-privacy"><span class="slider"></span></label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
