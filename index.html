<!DOCTYPE html>
<html lang="en" dir="ltr" data-device="pc" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Anime Loft · open source anime streaming</title>
  <meta name="description" content="Anime Loft is an open source anime catalog and player.">
  <meta name="theme-color" content="#061521">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Metal+Mania&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      try {
        var d = document.documentElement;
        d.dataset.theme = localStorage.getItem('loft_theme') || 'dark';
        d.dataset.device = localStorage.getItem('loft_device_mode') || 'pc';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#app-main">Skip to content</a>
  <header id="navbar" class="navbar">
    <nav class="nav-inner" aria-label="Main">
      <a href="#/home" class="brand" aria-label="Anime Loft home">
        <span class="brand-mark"><img src="assets/logo.svg" alt="" width="32" height="32"></span>
        <span class="wordmark"><span class="wm-anime">ANIME</span><span class="wm-loft">LOFT</span></span>
      </a>
      <div class="nav-tabs" aria-label="Sections">
        <a class="nav-tab" href="#/home" data-view="home"><i class="ph ph-house"></i><span>Home</span></a>
        <a class="nav-tab" href="#/browse" data-view="browse"><i class="ph ph-funnel-simple"></i><span>Browse</span></a>
        <a class="nav-tab" href="#/list" data-view="list"><i class="ph ph-bookmarks-simple"></i><span>My list</span></a>
      </div>
      <form id="search-form" class="nav-search" role="search">
        <i class="ph ph-magnifying-glass"></i>
        <input id="search-input" type="search" placeholder="Search anime">
      </form>
      <div class="nav-actions">
        <button id="btn-settings" type="button" class="icon-btn"><i class="ph ph-gear-six"></i></button>
      </div>
    </nav>
  </header>
  <nav id="tabbar" class="tabbar">
    <a class="tab-item" href="#/home" data-view="home"><i class="ph ph-house"></i><span>Home</span></a>
    <a class="tab-item" href="#/browse" data-view="browse"><i class="ph ph-funnel-simple"></i><span>Browse</span></a>
    <a class="tab-item" href="#/list" data-view="list"><i class="ph ph-bookmarks-simple"></i><span>List</span></a>
  </nav>
  <main id="app-main" tabindex="-1">
    <section id="view-home" class="view" data-view-panel="home">
      <div id="hero" class="hero"></div>
      <div class="wrap stack-rows">
        <div id="row-continue" class="row" hidden><div class="rail" id="rail-continue"></div></div>
        <div id="home-rows"></div>
      </div>
    </section>
    <section id="view-browse" class="view wrap" data-view-panel="browse" hidden>
      <form id="filters" class="filters">
        <select id="f-year" class="field"></select>
        <select id="f-season" class="field"><option value="">Temporada</option><option value="WINTER">Inverno</option><option value="SPRING">Primavera</option><option value="SUMMER">Verão</option><option value="FALL">Outono</option></select>
        <select id="f-format" class="field"><option value="">Formato</option><option value="TV">TV</option><option value="MOVIE">Filme</option></select>
        <select id="f-genre" class="field"></select>
        <select id="f-sort" class="field"><option value="POPULARITY_DESC">Populares</option><option value="TRENDING_DESC">Em alta</option></select>
      </form>
      <div id="browse-grid" class="grid"></div>
    </section>
    <section id="view-list" class="view wrap" data-view-panel="list" hidden>
      <h1 class="heading-4">Minha Lista</h1>
      <div id="list-continue" class="continue-list"></div>
      <div id="list-favs" class="grid"></div>
    </section>
    <section id="view-search" class="view wrap" data-view-panel="search" hidden>
      <h1 id="search-h" class="heading-4"></h1>
      <div id="search-grid" class="grid"></div>
    </section>
  </main>
  <aside id="mascot" class="mascot">
    <div class="mascot-bubble"><button type="button" id="mascot-min" class="mascot-x"><i class="ph ph-minus"></i></button><strong id="mascot-name">Yuki</strong><p id="mascot-say"></p></div>
    <button type="button" id="mascot-avatar" class="mascot-avatar"><i class="ph ph-book-open-text"></i></button>
  </aside>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/mascot.js"></script>
</body>
</html>
