<!DOCTYPE html>
<html lang="pt-BR" data-device="pc">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anime Loft — Catálogo Open Source</title>
<meta name="theme-color" content="#0b0c10">
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: { bg: '#0b0c10', card: '#15171e', accent: '#6366f1' } } } };
</script>
</head>
<body class="bg-bg text-gray-100 antialiased">

  <!-- ONBOARDING: SELEÇÃO DE DISPOSITIVO -->
  <div id="onboarding" class="onboarding hidden fixed inset-0 z-[90]" role="dialog" aria-modal="true" aria-labelledby="ob-title">
    <div class="ob-card">
      <div class="maint-logo">
        <img src="logo.jpg" alt="Anime Loft" class="w-14 h-14 rounded-2xl object-cover border border-white/15" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
        <span class="logo-fallback big" style="display:none" aria-hidden="true"><svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
      </div>
      <h2 id="ob-title" data-i18n="deviceTitle"></h2>
      <p class="ob-sub" data-i18n="deviceSub"></p>
      <div class="ob-options" role="group" aria-labelledby="ob-title">
        <button type="button" class="ob-option" data-device="pc">
          <span class="ob-emoji" aria-hidden="true">🖥️</span><b data-i18n="devPC"></b><small data-i18n="devPCHint"></small><i class="ob-rec" data-i18n="devRec"></i>
        </button>
        <button type="button" class="ob-option" data-device="tv">
          <span class="ob-emoji" aria-hidden="true">📺</span><b data-i18n="devTV"></b><small data-i18n="devTVHint"></small><i class="ob-rec" data-i18n="devRec"></i>
        </button>
        <button type="button" class="ob-option" data-device="mobile">
          <span class="ob-emoji" aria-hidden="true">📱</span><b data-i18n="devMobile"></b><small data-i18n="devMobileHint"></small><i class="ob-rec" data-i18n="devRec"></i>
        </button>
      </div>
      <div class="ob-langs" role="group" aria-label="Language">
        <button type="button" class="genre-chip" data-ob-lang="pt">Português</button>
        <button type="button" class="genre-chip" data-ob-lang="en">English</button>
        <button type="button" class="genre-chip" data-ob-lang="es">Español</button>
        <button type="button" class="genre-chip" data-ob-lang="bn">বাংলা</button>
      </div>
      <p class="ob-foot" data-i18n="deviceHint"></p>
    </div>
  </div>

  <!-- TELA DE MANUTENÇÃO AUTOMÁTICA -->
  <div id="maintenance-screen" class="hidden fixed inset-0 z-[80] bg-bg/98 backdrop-blur-xl flex items-center justify-center p-6 text-center">
    <div class="max-w-md w-full bg-card border border-white/10 rounded-3xl p-8 shadow-2xl space-y-5">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-indigo-500/15 border border-indigo-500/30 flex items-center justify-center text-3xl">🛠️</div>
      <h1 class="text-2xl font-black text-white">Anime Loft em Manutenção</h1>
      <p id="maintenance-msg" class="text-sm text-gray-300 leading-relaxed">Estamos realizando ajustes automáticos nos servidores. Voltamos já!</p>
      <div class="flex flex-col sm:flex-row gap-2.5 pt-2">
        <button type="button" onclick="location.reload()" class="btn-accent flex-1">🔄 Tentar Reconectar</button>
        <a href="https://discord.gg/3qeKkseWSs" target="_blank" rel="noopener noreferrer" class="btn-discord flex-1">💬 Discord</a>
      </div>
    </div>
  </div>

  <!-- NAVBAR (z-40) -->
  <header id="navbar" class="fixed top-0 inset-x-0 z-40 bg-bg/90 backdrop-blur border-b border-white/5">
    <div class="flex flex-wrap items-center gap-x-3 gap-y-1 px-3 sm:px-4 py-1 lg:py-0 lg:h-16 max-w-[1600px] mx-auto">
      <a href="./" class="order-1 flex items-center gap-2.5 h-10 font-extrabold text-lg tracking-tight" aria-label="Anime Loft">
        <img src="logo.jpg" alt="Anime Loft" class="w-8 h-8 rounded-lg object-cover border border-white/15" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
        <span class="logo-mark" style="display:none">A</span>
        <span>Anime <span class="text-accent">Loft</span></span>
      </a>

      <div class="order-2 lg:order-4 ml-auto flex items-center gap-2 h-10">
        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="btn-ghost hidden sm:inline-flex" title="Repositório Open Source">GitHub</a>
        <button data-act="settings" class="btn-ghost" title="Configurações e Provedores">⚙️</button>
        <button data-act="surprise" class="btn-ghost" title="Surpreenda-me"><span aria-hidden="true">🎲</span> <span class="hidden sm:inline" data-i18n="surprise">Surpreenda-me</span></button>
        <select id="lang" class="btn-ghost bg-card" aria-label="Idioma">
          <option value="pt">PT</option><option value="en">EN</option><option value="es">ES</option><option value="bn">BN</option>
        </select>
        <button id="login-btn" data-act="login" class="btn-accent" data-i18n="login">Login AniList</button>
      </div>

      <div class="basis-full h-0 lg:hidden order-2"></div>
      <nav class="order-3 lg:order-2 flex items-center gap-1 h-10" id="tabs">
        <button class="tab active" data-act="tab" data-view="home" data-i18n="home">Início</button>
        <button class="tab" data-act="tab" data-view="cat" data-i18n="categories">Categorias & Filtros</button>
        <button class="tab" data-act="tab" data-view="list" data-i18n="mylist">Minha Lista</button>
      </nav>
      <div class="order-4 lg:order-3 flex-1 lg:flex-none lg:w-72 lg:ml-auto h-10 flex items-center">
        <input id="search" type="search" autocomplete="off" class="search-input" data-i18n-ph="search" placeholder="Buscar anime… ( / )">
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main id="app-main" class="pt-28 lg:pt-16 pb-28 max-w-[1600px] mx-auto">
    <section id="view-home">
      <div id="hero" class="hero mx-3 sm:mx-4 mt-4"></div>
      <div id="home-rows" class="mt-6 space-y-8"></div>
      <section class="mt-8 px-3 sm:px-4">
        <h2 class="row-title" data-i18n="genres">Explorar por Gênero</h2>
        <div id="home-chips" class="chips"></div>
        <div id="home-grid" class="grid-cards mt-4"></div>
        <div class="text-center mt-4"><button id="home-more" data-act="more" data-scope="home" class="btn-ghost hidden" data-i18n="more">Carregar mais</button></div>
      </section>
    </section>

    <!-- ABA CATEGORIAS & FILTROS AVANÇADOS -->
    <section id="view-cat" class="hidden px-3 sm:px-4 pt-4 space-y-6">
      <div class="flex flex-wrap items-center gap-3 bg-card p-4 rounded-2xl border border-white/5">
        <div class="flex-1 min-w-[140px]">
          <label class="block text-xs font-bold text-gray-400 mb-1">Ano de Lançamento</label>
          <select id="filter-year" class="w-full bg-bg border border-white/10 rounded-xl p-2 text-xs text-white">
            <option value="">Todos os Anos</option>
            <option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option><option value="2023">2023</option><option value="2022">2022</option><option value="2020">2020+</option><option value="2015">2015+</option>
          </select>
        </div>
        <div class="flex-1 min-w-[140px]">
          <label class="block text-xs font-bold text-gray-400 mb-1">Estação do Ano</label>
          <select id="filter-season" class="w-full bg-bg border border-white/10 rounded-xl p-2 text-xs text-white">
            <option value="">Todas as Estações</option>
            <option value="WINTER">Inverno (Winter)</option><option value="SPRING">Primavera (Spring)</option><option value="SUMMER">Verão (Summer)</option><option value="FALL">Outono (Fall)</option>
          </select>
        </div>
        <div class="flex-1 min-w-[140px]">
          <label class="block text-xs font-bold text-gray-400 mb-1">Formato</label>
          <select id="filter-format" class="w-full bg-bg border border-white/10 rounded-xl p-2 text-xs text-white">
            <option value="">Todos os Formatos</option>
            <option value="TV">TV Serie</option><option value="MOVIE">Filme (Movie)</option><option value="OVA">OVA</option><option value="SPECIAL">Special</option>
          </select>
        </div>
        <div class="flex items-end">
          <button type="button" id="btn-apply-filters" class="btn-accent px-5 py-2 text-xs">Aplicar Filtros</button>
        </div>
      </div>

      <div>
        <h2 class="row-title" data-i18n="categories">Gêneros Disponíveis</h2>
        <div id="cat-chips" class="chips mb-4"></div>
        <div id="cat-grid" class="grid-cards"></div>
        <div class="text-center mt-4"><button id="cat-more" data-act="more" data-scope="cat" class="btn-ghost hidden" data-i18n="more">Carregar mais</button></div>
      </div>
    </section>

    <section id="view-list" class="hidden px-3 sm:px-4 pt-4">
      <div id="list-body" class="space-y-8"></div>
    </section>

    <section id="view-search" class="hidden px-3 sm:px-4 pt-4">
      <h2 class="row-title" data-i18n="results">Resultados</h2>
      <div id="search-grid" class="grid-cards mt-4"></div>
    </section>
  </main>

  <!-- MODAL DE CONFIGURAÇÕES & PROVEDORES (z-[75]) -->
  <div id="settings-modal" class="modal hidden fixed inset-0 z-[75] overflow-y-auto bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="w-full max-w-lg bg-card border border-white/10 rounded-3xl p-6 shadow-2xl space-y-5 text-gray-100 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-black text-white">⚙️ Configurações & Provedores</h2>
        <button data-act="close-settings" class="w-8 h-8 rounded-full bg-white/10 text-white flex items-center justify-center">✕</button>
      </div>
      
      <div class="space-y-4 text-xs">
        <section class="set-row">
          <h3 data-i18n="deviceLabel"></h3>
          <div class="set-chips flex gap-2 mt-1">
            <button type="button" class="genre-chip" data-device-set="pc" data-i18n="devPC"></button>
            <button type="button" class="genre-chip" data-device-set="tv" data-i18n="devTV"></button>
            <button type="button" class="genre-chip" data-device-set="mobile" data-i18n="devMobile"></button>
          </div>
        </section>

        <section class="set-row mt-3">
          <h3 data-i18n="providers"></h3>
          <p class="set-note text-gray-400 text-[11px] mb-2" data-i18n="providersHint"></p>
          <div id="set-providers" class="prov-list"></div>
        </section>

        <div class="flex items-center justify-between p-3 rounded-xl bg-bg border border-white/10 mt-3">
          <div>
            <span class="font-bold text-white block">Exibir Conteúdo +18 (NSFW / Hentai)</span>
            <span class="text-[11px] text-gray-400">
